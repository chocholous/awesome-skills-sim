name: Validate skill PRs and regenerate catalog

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "skills/**"
      - ".claude-plugin/**"

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Check PR scope (one skill per PR, no out-of-bounds files)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          MAINTAINER=0
          case ",$PR_LABELS," in
            *,maintainer,*)
              MAINTAINER=1
              echo "::notice::maintainer label present — multi-skill/infra PR allowed"
              ;;
          esac

          CHANGED=$(git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD")
          if [ -z "$CHANGED" ]; then
            echo "No file changes detected."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  - /'
          echo

          SKILL_DIRS=$(echo "$CHANGED" | grep -oE '^skills/apify-[^/]+' | sort -u)
          N_SKILLS=$(echo "$SKILL_DIRS" | grep -c . || true)

          # Allowed paths fall into two buckets:
          #   - Skill submissions: skills/apify-<name>/ only — the catalog is generated.
          #   - Repo maintenance:  root meta files, CI, scripts, generated agents/.
          ALLOWED='^(skills/apify-[^/]+/|skills/_template/|\.claude-plugin/marketplace\.json$|LICENSE$|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|CODE_OF_CONDUCT\.md$|\.gitignore$|\.github/|scripts/|agents/)'
          OUT_OF_BOUNDS=$(echo "$CHANGED" | grep -vE "$ALLOWED" || true)

          FAIL=0

          if [ "$MAINTAINER" -eq 0 ] && [ "$N_SKILLS" -gt 1 ]; then
            echo "::error::PR touches $N_SKILLS skills; one skill per PR (or ask a maintainer for the 'maintainer' label)."
            echo "$SKILL_DIRS" | sed 's/^/  - /'
            FAIL=1
          fi

          if [ -n "$OUT_OF_BOUNDS" ]; then
            echo "::error::PR touches files outside the allowed paths (skill dirs, root meta files, .github/, scripts/, agents/):"
            echo "$OUT_OF_BOUNDS" | sed 's/^/  - /'
            FAIL=1
          fi

          # Skill PRs must not touch generated files — the bot regenerates them
          # after merge. Infra PRs (no skills/ changes) and maintainer-labeled
          # PRs may touch them.
          if [ "$MAINTAINER" -eq 0 ] && [ -n "$SKILL_DIRS" ]; then
            GENERATED_TOUCHED=$(echo "$CHANGED" | grep -E '^(\.claude-plugin/marketplace\.json|agents/AGENTS\.md)$' || true)

            if echo "$CHANGED" | grep -qx 'README.md'; then
              BASE_BLOCK=$(git show "origin/$BASE_REF:README.md" | sed -n '/<!-- BEGIN_SKILLS_TABLE -->/,/<!-- END_SKILLS_TABLE -->/p')
              HEAD_BLOCK=$(sed -n '/<!-- BEGIN_SKILLS_TABLE -->/,/<!-- END_SKILLS_TABLE -->/p' README.md)
              if [ "$BASE_BLOCK" != "$HEAD_BLOCK" ]; then
                GENERATED_TOUCHED=$(printf '%s\nREADME.md (skills table block)' "$GENERATED_TOUCHED")
              fi
            fi

            if [ -n "$GENERATED_TOUCHED" ]; then
              echo "::error::.claude-plugin/marketplace.json: generated file — edit SKILL.md frontmatter instead, the bot regenerates the catalog after merge"
              echo "$GENERATED_TOUCHED" | grep . | sed 's/^/  - /'
              FAIL=1
            fi
          fi

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi

      - name: Check PR checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "::error::PR description is empty — please fill in the template."
            exit 1
          fi

          UNCHECKED=$(echo "$PR_BODY" | grep -nE '^- \[ \]' || true)
          if [ -n "$UNCHECKED" ]; then
            echo "::error::PR checklist has unchecked boxes — please complete them:"
            echo "$UNCHECKED" | sed 's/^/  /'
            exit 1
          fi

      - name: Lint telemetry user-agent
        run: bash scripts/lint_telemetry.sh

      - name: Lint references
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Only skills changed in this PR are linted (same scope logic as the
          # scope check above). Pre-existing findings on main are deliberately
          # kept as exhibits (decision D2), so a full-repo run would fail every
          # future PR. Full run for local/maintainer use:
          #   uv run scripts/lint_references.py --check-actors
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD")
          SKILL_DIRS=$(echo "$CHANGED" | grep -oE '^skills/apify-[^/]+' | sort -u)
          N_SKILLS=$(echo "$SKILL_DIRS" | grep -c . || true)

          if [ "$N_SKILLS" -eq 0 ]; then
            echo "No skill directories changed — skipping reference lint."
            exit 0
          fi

          # shellcheck disable=SC2086 — word-splitting SKILL_DIRS is intended
          if [ "$N_SKILLS" -eq 1 ]; then
            # Single-skill PR: offline checks + online actor existence check.
            uv run scripts/lint_references.py $SKILL_DIRS --check-actors $SKILL_DIRS
          else
            uv run scripts/lint_references.py $SKILL_DIRS
          fi

      - name: Validate skills and run a trial generation
        run: uv run scripts/generate_agents.py

  regenerate:
    if: github.event_name == 'push' && github.actor != 'awesome-skills-sim-bot[bot]'
    # Serialize regen runs: two quick merges must not race each other's push
    # (a lost race can leave main's catalog stale until the next push).
    concurrency:
      group: regenerate-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Regenerate and push catalog
        run: |
          git config user.name "awesome-skills-sim-bot[bot]"
          git config user.email "awesome-skills-sim-bot[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            uv run scripts/generate_agents.py
            if git diff --quiet; then
              echo "Catalog already at fixed point — nothing to push."
              exit 0
            fi
            git commit -am "chore: regenerate marketplace.json, AGENTS.md and README [bot]"
            if git push; then
              exit 0
            fi
            echo "Push rejected (main moved) — refreshing and retrying ($attempt/3)."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::regenerate: could not push after 3 attempts — main is moving too fast; re-run this job."
          exit 1

      - name: Validate marketplace manifest (strict)
        # Verified locally: ~2 s warm, exit 1 on an invalid manifest.
        run: npx --yes @anthropic-ai/claude-code plugin validate --strict .
